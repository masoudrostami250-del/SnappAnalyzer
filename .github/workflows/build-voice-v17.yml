name: Build Snapp Voice v17 Fifth Voice

on:
  push:
    branches:
      - voice5-panjali-behbood
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install original fifth voice recordings
        shell: bash
        run: |
          mkdir -p app/src/main/res/raw
          unzip -o voice5-audio-files-8kbps.zip -d app/src/main/res/raw
          test -s app/src/main/res/raw/voice4_go.mp3
          test -s app/src/main/res/raw/voice4_stop.mp3
          ls -lh app/src/main/res/raw/voice4_*.mp3

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Persian and English OCR models
        shell: bash
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L --fail --retry 3 https://github.com/tesseract-ocr/tessdata_fast/raw/main/fas.traineddata -o app/src/main/assets/tessdata/fas.traineddata
          curl -L --fail --retry 3 https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata -o app/src/main/assets/tessdata/eng.traineddata
          test -s app/src/main/assets/tessdata/fas.traineddata
          test -s app/src/main/assets/tessdata/eng.traineddata

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Check APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnappVoice17000Pickup2km-Voice5-Panjali-Behbood
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Offline Tehran Map
on:
  push:
    branches: [offline-tehran-navigation-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Prepare offline Iran map package
        run: |
          mkdir -p map-package
          curl -L --fail --retry 3 'https://data.bbbike.org/osm/mapsforge/region/asia/iran/iran.osm.mapsforge-osm.zip' -o map-package/iran-map.zip
          unzip -l map-package/iran-map.zip | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: TehranOfflineMap-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Iran-Offline-Map-Data
          path: map-package/iran-map.zip
          if-no-files-found: error

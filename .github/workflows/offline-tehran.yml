name: Build Offline Tehran Routing V2
on:
  push:
    branches: [offline-tehran-routing-v2]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install OSM graph builder
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install osmium
      - name: Download map and create offline road graph
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 'https://data.bbbike.org/osm/mapsforge/region/asia/iran/iran.osm.mapsforge-osm.zip' -o /tmp/iran-map.zip
          MAP_ENTRY="$(unzip -Z1 /tmp/iran-map.zip | grep -m1 -E '\\.map$')"
          test -n "$MAP_ENTRY"
          unzip -p /tmp/iran-map.zip "$MAP_ENTRY" > app/src/main/assets/iran.map
          curl -L --fail --retry 3 'https://download.geofabrik.de/asia/iran-latest.osm.pbf' -o /tmp/iran.osm.pbf
          osmium extract -b 50.45,35.05,52.15,36.25 --strategy=complete_ways -o /tmp/tehran.osm.pbf /tmp/iran.osm.pbf
          python tools/build_tehran_routing.py /tmp/tehran.osm.pbf
          ls -lh app/src/main/assets/iran.map app/src/main/assets/tehran-routing.db
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TehranOfflineRoutingV2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
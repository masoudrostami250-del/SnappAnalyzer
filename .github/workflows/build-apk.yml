name: Build Snapp Voice Persian OCR 17000 Pickup 2km v16 Silent Without Offer

on:
  push:
    branches:
      - voice-17000-pickup-2km-snapp-update-resilient-v1
      - voice-17000-pickup-2km-snapp-update-resilient-v2
      - voice-selector-video-clips-v1
      - voice-17000-pickup2km-accessibility-restore-v1
      - voice-17000-pickup2km-diagnostic-v2
      - voice-17000-pickup2km-diagnostic-v3
      - voice-17000-pickup2km-multiwindow-v4
      - voice-17000-pickup2km-node-dump-v5
      - voice-17000-pickup2km-active-fare-v6
      - voice-17000-pickup2km-address-number-fix-v7
      - voice-17000-pickup2km-structure-report-v8
      - voice-17000-pickup2km-route-v9
      - voice-17000-pickup2km-screen-distances-v10
      - voice-17000-pickup2km-screen-ocr-v11
      - voice-17000-pickup2km-persian-ocr-v12
      - voice-17000-pickup2km-persian-ocr-fast-voice-v13
      - voice-17000-pickup2km-persian-ocr-fast-voice-3sec-v14
      - voice-17000-pickup2km-persian-ocr-once-per-trip-v15
      - voice-17000-pickup2km-silence-without-offer-v16
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate natural female Persian audio with Microsoft Neural
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          mkdir -p app/src/main/res/raw
          edge-tts --voice fa-IR-DilaraNeural --text "برو" --write-media app/src/main/res/raw/voice_go.mp3
          edge-tts --voice fa-IR-DilaraNeural --text "نرو" --write-media app/src/main/res/raw/voice_stop.mp3
          test -s app/src/main/res/raw/voice_go.mp3
          test -s app/src/main/res/raw/voice_stop.mp3
          ls -lh app/src/main/res/raw/

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Persian and English OCR models
        shell: bash
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L --fail --retry 3 https://github.com/tesseract-ocr/tessdata_fast/raw/main/fas.traineddata -o app/src/main/assets/tessdata/fas.traineddata
          curl -L --fail --retry 3 https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata -o app/src/main/assets/tessdata/eng.traineddata
          test -s app/src/main/assets/tessdata/fas.traineddata
          test -s app/src/main/assets/tessdata/eng.traineddata

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Check APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnappVoice17000Pickup2km-SilentWithoutOffer-v16
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


# Triggered through the default-branch v16 workflow definition.

name: Build Snapp Voice 17000 Female Pickup 1.5km

on:
  push:
    branches:
      - voice-17000-pickup-1-5km-female-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate natural female Persian audio with Microsoft Neural
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          mkdir -p app/src/main/res/raw
          edge-tts --voice fa-IR-DilaraNeural --text "برو" --write-media app/src/main/res/raw/voice_go.mp3
          edge-tts --voice fa-IR-DilaraNeural --text "نرو" --write-media app/src/main/res/raw/voice_stop.mp3
          test -s app/src/main/res/raw/voice_go.mp3
          test -s app/src/main/res/raw/voice_stop.mp3
          ls -lh app/src/main/res/raw/

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Check APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnappVoice17000Pickup1_5km-female
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

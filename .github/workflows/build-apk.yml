name: Build Snapp Voice 17000 Pickup 2km Fare 75k Female

on:
  push:
    branches:
      - voice-17000-pickup2km-fare75k-female-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install original recordings from the 90k app
        shell: bash
        run: |
          mkdir -p app/src/main/res/raw
          BASE="https://raw.githubusercontent.com/masoudrostami250-del/SnappAnalyzer/voice5-pickup2km-fare90k"
          for name in voice1_go voice1_stop voice2_go voice2_stop voice3_go voice3_stop; do
            curl -L --fail --retry 3 "$BASE/app/src/main/res/raw/$name.ogg" -o "app/src/main/res/raw/$name.ogg"
            test -s "app/src/main/res/raw/$name.ogg"
          done
          curl -L --fail --retry 3 "$BASE/voice5-audio-files-8kbps.zip" -o /tmp/voice5-audio-files.zip
          unzip -o /tmp/voice5-audio-files.zip -d app/src/main/res/raw
          test -s app/src/main/res/raw/voice4_go.mp3
          test -s app/src/main/res/raw/voice4_stop.mp3

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snapp-17000-2km-75000-Female-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Snapp Voice 16000

on:
  push:
    branches:
      - voice-per-km-16000-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate offline Persian audio prompts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          mkdir -p app/src/main/res/raw
          espeak-ng --voices=fa
          espeak-ng -v fa -s 145 -p 85 -a 180 -w app/src/main/res/raw/voice_good.wav "خوبه"
          espeak-ng -v fa -s 145 -p 85 -a 180 -w app/src/main/res/raw/voice_bad.wav "بده"
          test -s app/src/main/res/raw/voice_good.wav
          test -s app/src/main/res/raw/voice_bad.wav

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Check APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnappVoice16000-offline-audio
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

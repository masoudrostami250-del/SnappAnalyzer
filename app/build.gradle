plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snapfloat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.snapfloat.voice17000pickup2kmscreendistances'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3-consecutive-card-fix'
    }

    dependencies {
        implementation 'cz.adaptech.tesseract4android:tesseract4android:4.7.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

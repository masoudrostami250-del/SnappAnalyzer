plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snapfloat'
    compileSdk 35

    signingConfigs {
        release {
            storeFile file("keystore/snapfloat-release.p12")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "snapfloat"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
            storeType "pkcs12"
        }
    }

    defaultConfig {
        applicationId 'com.snapfloat'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '1.1'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
}

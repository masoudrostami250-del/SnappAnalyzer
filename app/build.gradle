plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snapfloat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.snapfloat.voice17000pickup2kmscreendistances'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.1-screen-ocr'
    }

    dependencies {
        implementation 'com.google.mlkit:text-recognition:16.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

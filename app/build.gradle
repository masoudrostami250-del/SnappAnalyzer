plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snapfloat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.snapfloat'
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName '2.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

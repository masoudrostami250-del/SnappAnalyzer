plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

android {
    namespace 'com.snapfloat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.snapfloat.voiceocr17000pickup2km'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
